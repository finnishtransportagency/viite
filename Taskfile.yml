version: "3"

dotenv:
  - .env
set:
  - u
  - pipefail

includes:
  db:
    taskfile: ./taskfiles/db-default.yml
    dir: .

  flyway:
    taskfile: ./taskfiles/flyway.yml
    dir: .

  backup:
    taskfile: ./taskfiles/db-backup.yml
    dir: .

  restore:
    taskfile: ./taskfiles/db-restore.yml
    dir: .

tasks:
  db:backup:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    desc: "Backup with profile env (.env.common + .env.<profile>), allows
      local|dev|test|exp|prod"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        validate_profile_for_mode backup "$ENV_PROFILE"
        load_profile_env "$ENV_PROFILE"

        echo "Running backup with ENV_PROFILE=$ENV_PROFILE"
        task backup:backup

  db:restore:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    desc: "Restore with profile env (.env.common + .env.<profile>), allows
      local|dev|test|exp"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        validate_profile_for_mode restore "$ENV_PROFILE"
        load_profile_env "$ENV_PROFILE"

        echo "Running restore with ENV_PROFILE=$ENV_PROFILE"
        task restore:restore

  db:flyway:migrate:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    desc: "Flyway migrate with profile env, maps to SOURCE DB"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        validate_profile_for_mode flyway "$ENV_PROFILE"
        load_profile_env "$ENV_PROFILE"
        map_source_to_flyway_env

        echo "Running flyway:migrate with ENV_PROFILE=$ENV_PROFILE"
        task flyway:migrate

  db:flyway:history:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    desc: "Flyway history with profile env, shows SOURCE DB schema history"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        validate_profile_for_mode flyway "$ENV_PROFILE"
        load_profile_env "$ENV_PROFILE"
        map_source_to_flyway_env

        echo "Running flyway:history with ENV_PROFILE=$ENV_PROFILE"
        task flyway:history

  db:flyway:repair:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    desc: "Flyway repair with profile env, fixes SOURCE DB checksum metadata"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        validate_profile_for_mode flyway "$ENV_PROFILE"
        load_profile_env "$ENV_PROFILE"
        map_source_to_flyway_env

        echo "Running flyway:repair with ENV_PROFILE=$ENV_PROFILE"
        task flyway:repair

  default:
    desc: Commands available.
    silent: true
    cmds:
      - |
        cat <<'EOF'

        -- COMMON -----------------------------------
        * db:connect:                 Open SSM port-forward with ENV_PROFILE=<local|dev|test|exp|prod>
        * db:disconnect:              Stop SSM port-forward (supports ENV_PROFILE)
        * db:ping:                    Ping database with ENV_PROFILE=<local|dev|test|exp|prod>
        * db:postgis:                 Ensure PostGIS extension with ENV_PROFILE=<local|dev|test|exp|prod>
        * db:create-user-schema:      Create dev users/schemas (DEV_USERS=<u1,u2>)

        -- BACKUP -----------------------------------
        * db:backup:                  Backup SOURCE with ENV_PROFILE=<local|dev|test|exp|prod>

        -- FLYWAY ------------------------------------
        * db:flyway:migrate:          Flyway migrate with ENV_PROFILE=<local|dev|test|exp|prod>
        * db:flyway:history:          Show flyway_schema_history with ENV_PROFILE=<local|dev|test|exp|prod>
        * db:flyway:repair:           Flyway repair checksum with ENV_PROFILE=<local|dev|test|exp|prod>

        -- RESTORE -----------------------------------
        * db:restore:                 Restore latest dump with ENV_PROFILE=<local|dev|test|exp>

        EOF
