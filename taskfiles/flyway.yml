version: "3"

vars:
  TUNNEL_SESSION: db-tunnel
  FLYWAY_SCHEMA: "{{default \"public\" .FLYWAY_SCHEMA}}"

tasks:
  # --- Tunnel (dev) ---------------------------------------------------------
  tunnel:start:
    internal: true
    silent: true
    desc: "Open SSM port-forward to RDS (dev) via tmux"
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh

        ACCESS="ssm"
        if [[ -n "${FLYWAY_URL:-}" ]]; then
          ACCESS="direct"
        elif [[ "${DB_HOST:-}" == "localhost" || "${DB_HOST:-}" == "127.0.0.1" ]]; then
          ACCESS="direct"
        elif [[ -z "${SSM_TARGET:-}" ]]; then
          ACCESS="direct"
        fi

        start_ssm_tunnel \
          "{{.TUNNEL_SESSION}}" \
          "FLYWAY" \
          "$ACCESS" \
          "${DB_HOST:-127.0.0.1}" \
          "${LOCAL_DB_PORT:?LOCAL_DB_PORT missing}" \
          "${DB_PORT:-5432}" \
          "${SSM_TARGET:-}" \
          "${AWS_REGION:-}" \
          "${AWS_PROFILE:-}" \
          "false"

  tunnel:stop:
    internal: true
    desc: "Stop SSM tunnel (tmux)"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh

        ACCESS="ssm"
        if [[ -n "${FLYWAY_URL:-}" ]]; then
          ACCESS="direct"
        elif [[ "${DB_HOST:-}" == "localhost" || "${DB_HOST:-}" == "127.0.0.1" ]]; then
          ACCESS="direct"
        elif [[ -z "${SSM_TARGET:-}" ]]; then
          ACCESS="direct"
        fi

        stop_ssm_tunnel \
          "{{.TUNNEL_SESSION}}" \
          "FLYWAY" \
          "$ACCESS" \
          "${DB_HOST:-127.0.0.1}" \
          "${DB_PORT:-5432}" \
          "${LOCAL_DB_PORT:-unknown}"

  # --- Internal helper: build URL and run DataFixture ------------------------
  _run:
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail

        DBN="${FLYWAY_DB_NAME:?FLYWAY_DB_NAME missing}"
        USERN="${FLYWAY_USER:?FLYWAY_USER missing}"
        PASSW="${FLYWAY_PASSWORD:-}"

        # If FLYWAY_URL is provided, use it. Otherwise build localhost URL (tunnel/dev).
        URL="${FLYWAY_URL:-jdbc:postgresql://127.0.0.1:${LOCAL_DB_PORT}/${DBN}}"
        SCHEMA="{{.FLYWAY_SCHEMA}}"

        echo "Flyway {{.ACTION}}"
        echo "  db     = $DBN"
        echo "  schema = $SCHEMA"
        echo "  user   = $USERN"
        echo "  url    = $URL"

        export SBT_OPTS="
          -Dflyway.schemas=${SCHEMA}
          -Dflyway.url=${URL}
          -Dflyway.user=${USERN}
          -Dflyway.password=${PASSW}
        "

        sbt 'project viiteJar' \
            "test:runMain fi.liikennevirasto.viite.util.DataFixture {{.RUNNER_ARG}}"
    requires:
      vars: [ FLYWAY_DB_NAME, FLYWAY_USER ]

  # --- Public tasks: migrate, history ------------------------------------
  migrate:
    silent: true
    desc: "Flyway migrate via DataFixture [IMPLEMENTATION TASK — prefer
      db:flyway:migrate wrapper]"
    deps:
      # tunnel only if you are NOT providing FLYWAY_URL (dev-mode)
      - task: tunnel:start
        vars: {}
    cmds:
      - task: _run
        vars:
          ACTION: MIGRATE
          RUNNER_ARG: flyway_migrate

  repair:
    silent: true
    desc: "Flyway repair via DataFixture [IMPLEMENTATION TASK — prefer
      db:flyway:repair wrapper]"
    deps:
      - task: tunnel:start
        vars: {}
    cmds:
      - task: _run
        vars:
          ACTION: REPAIR
          RUNNER_ARG: flyway_repair

  history:
    desc: "Show flyway_schema_history [IMPLEMENTATION TASK - prefer
      db:flyway:history wrapper]"
    deps:
      - task: tunnel:start
        vars: {}
    silent: true
    cmds:
      - |
        set -euo pipefail

        DBN="${FLYWAY_DB_NAME:?FLYWAY_DB_NAME missing}"
        USERN="${FLYWAY_USER:?FLYWAY_USER missing}"
        PASSW="${FLYWAY_PASSWORD:-}"

        PGPASSWORD="$PASSW" \
        psql \
          -h 127.0.0.1 \
          -p "$LOCAL_DB_PORT" \
          -U "$USERN" \
          -d "$DBN" \
          -v ON_ERROR_STOP=1 \
          -c "
            SELECT installed_rank,
                   version,
                   description,
                   type,
                   script,
                   installed_by,
                   installed_on,
                   success
            FROM public.flyway_schema_history
            ORDER BY installed_rank;
          "
    requires:
      vars: [ FLYWAY_DB_NAME, FLYWAY_USER, LOCAL_DB_PORT ]
