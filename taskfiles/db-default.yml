version: "3"

tasks:
  connect:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
      TUNNEL_SESSION: "db-tunnel-{{.ENV_PROFILE}}"
    silent: true
    desc: "Open SSM port-forward with ENV_PROFILE=<local|dev|test|prod> (or no-op
      for direct/local)"
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        load_and_map_default_env "$ENV_PROFILE"
        echo "Running db:connect with ENV_PROFILE=$ENV_PROFILE"

        ACCESS="ssm"
        if [[ "${DB_HOST:-}" == "localhost" || "${DB_HOST:-}" == "127.0.0.1" ]]; then
          ACCESS="direct"
        elif [[ -z "${SSM_TARGET:-}" ]]; then
          ACCESS="direct"
        fi

        start_ssm_tunnel \
          "{{.TUNNEL_SESSION}}" \
          "{{.ENV_PROFILE}}" \
          "$ACCESS" \
          "$DB_HOST" \
          "$LOCAL_DB_PORT" \
          "$DB_PORT" \
          "${SSM_TARGET:-}" \
          "${AWS_REGION:-}" \
          "${AWS_PROFILE:-}" \
          "false"
    status:
      - tmux has-session -t {{.TUNNEL_SESSION}} 2>/dev/null

  disconnect:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
      TUNNEL_SESSION: "db-tunnel-{{.ENV_PROFILE}}"
    desc: "Stop DEFAULT SSM port-forward (supports ENV_PROFILE)"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        load_and_map_default_env "$ENV_PROFILE"

        ACCESS="ssm"
        if [[ "${DB_HOST:-}" == "localhost" || "${DB_HOST:-}" == "127.0.0.1" ]]; then
          ACCESS="direct"
        elif [[ -z "${SSM_TARGET:-}" ]]; then
          ACCESS="direct"
        fi

        echo "Running db:disconnect with ENV_PROFILE=$ENV_PROFILE"
        stop_ssm_tunnel "{{.TUNNEL_SESSION}}" "{{.ENV_PROFILE}}" "$ACCESS" "$DB_HOST" "$DB_PORT" "$LOCAL_DB_PORT"

  ping:
    vars:
      ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    desc: "Ping database with ENV_PROFILE=<local|dev|test|prod>"
    deps:
      - task: connect
        vars:
          ENV_PROFILE: "{{.ENV_PROFILE}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="{{.ENV_PROFILE}}"
        load_and_map_default_env "$ENV_PROFILE"
        PSQL_BIN="${PSQL_BIN:-psql}"

        echo "Running db:ping with ENV_PROFILE=$ENV_PROFILE"

        echo "Pinging DEFAULT DB via localhost:${LOCAL_DB_PORT} (${DB_NAME}) as ${DB_USER}"

        ENV_TYPE=$(PGPASSWORD="$DB_PASSWORD" \
          "$PSQL_BIN" -X -q -t -A \
            -h 127.0.0.1 \
            -p "$LOCAL_DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "SELECT CASE WHEN EXISTS (
                    SELECT 1 FROM pg_roles WHERE rolname = 'rdsadmin'
                )
                THEN 'RDS'
                ELSE 'LOCAL'
                END;")

        if [ "$ENV_TYPE" = "LOCAL" ]; then
          printf "\033[0;32mLocal database: TRUE\033[0m\n"
        else
          printf "\033[0;31mRDS database: TRUE\033[0m\n"
        fi

        PGPASSWORD="$DB_PASSWORD" \
          "$PSQL_BIN" \
            -h 127.0.0.1 \
            -p "$LOCAL_DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "
              SELECT
                current_database() AS database,
                current_user AS user,
                inet_server_addr() AS server_ip,
                inet_server_port() AS server_port,
                now() AS connected_at;
            "

  postgis:
    desc: "Ensure PostGIS extension exists with ENV_PROFILE=<local|dev|test|prod>"
    deps:
      - task: connect
        vars:
          ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="${ENV_PROFILE:-local}"
        load_and_map_default_env "$ENV_PROFILE"
        PSQL_BIN="${PSQL_BIN:-psql}"

        echo "Running db:postgis with ENV_PROFILE=$ENV_PROFILE"

        echo "Ensuring PostGIS extension exists in DB=$DB_NAME"
        PGPASSWORD="$DB_PASSWORD" \
          "$PSQL_BIN" \
            -h 127.0.0.1 \
            -p "$LOCAL_DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "SELECT PostGIS_Version();"

  create-user-schema:
    desc: "Create dev users/schemas with ENV_PROFILE=<local|dev|test|prod>"
    deps:
      - task: connect
        vars:
          ENV_PROFILE: "{{default \"local\" .ENV_PROFILE}}"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        ENV_PROFILE="${ENV_PROFILE:-local}"
        load_and_map_default_env "$ENV_PROFILE"
        PSQL_BIN="${PSQL_BIN:-psql}"
        DEV_USERS_FROM_TASK='{{default "" .DEV_USERS}}'

        echo "Running db:create-user-schema with ENV_PROFILE=$ENV_PROFILE"

        if [ -z "${DEV_USERS:-}" ] && [ -n "$DEV_USERS_FROM_TASK" ]; then
          DEV_USERS="$DEV_USERS_FROM_TASK"
        fi

        : "${DEV_USERS:?DEV_USERS missing}"
        echo "Running schemas for users: $DEV_USERS "
        echo ""

        PGPASSWORD="$DB_PASSWORD" \
          "$PSQL_BIN" \
            -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -p "$LOCAL_DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -c "SET app.dev_users TO '$DEV_USERS';" \
            -c "SET app.base_password_prefix TO '${BASE_PASSWORD_PREFIX:-CHANGE_ME_}';" \
            -f db/admin/create_dev_users_and_schemas.sql \
            2>&1 \
          | grep -vE '^(SET|DO)$' \
          | sed -E 's/^psql:[^:]+:[0-9]+:\s+//'
