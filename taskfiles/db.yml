version: '3'

vars:
  SOURCE_TUNNEL_SESSION: db-tunnel-source
  TARGET_TUNNEL_SESSION: db-tunnel-target

tasks:

  # -------------------------
  # SOURCE tunnel (DBX_SOURCE_*)
  # -------------------------
  connect-source:
    desc: "Open SSM port-forward to SOURCE DB (background via tmux)"
    cmds:
      - |
        set -euo pipefail
        : "${DBX_SOURCE_DB_ACCESS:?DBX_SOURCE_DB_ACCESS missing (ssm|direct)}"
        if [ "$DBX_SOURCE_DB_ACCESS" != "ssm" ]; then
          echo "DBX_SOURCE_DB_ACCESS=$DBX_SOURCE_DB_ACCESS -> connect-source not needed."
          exit 0
        fi
        : "${DBX_SOURCE_DB_RDS_HOST:?missing}"
        : "${DBX_SOURCE_LOCAL_PORT:?missing}"
        : "${DBX_SOURCE_SSM_TARGET:?missing}"
        : "${AWS_PROFILE:?missing}"
        : "${AWS_REGION:?missing}"

        echo "Starting SOURCE SSM tunnel to $DBX_SOURCE_DB_RDS_HOST:5432 on localhost:$DBX_SOURCE_LOCAL_PORT"

        tmux has-session -t {{.SOURCE_TUNNEL_SESSION}} 2>/dev/null && {
          echo "Source tunnel already running."
          exit 0
        } || true

        tmux new-session -d -s {{.SOURCE_TUNNEL_SESSION}} \
          "aws ssm start-session \
            --region '$AWS_REGION' \
            --profile '$AWS_PROFILE' \
            --target '$DBX_SOURCE_SSM_TARGET' \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters host='$DBX_SOURCE_DB_RDS_HOST',portNumber='5432',localPortNumber='$DBX_SOURCE_LOCAL_PORT'"

        echo "SOURCE tunnel started."
    status:
      - tmux has-session -t {{.SOURCE_TUNNEL_SESSION}} 2>/dev/null
    requires:
      vars:
        - AWS_PROFILE
        - AWS_REGION
        - DBX_SOURCE_DB_ACCESS
        - DBX_SOURCE_DB_RDS_HOST
        - DBX_SOURCE_LOCAL_PORT
        - DBX_SOURCE_SSM_TARGET

  disconnect-source:
    desc: "Stop SOURCE SSM tunnel"
    cmds:
      - tmux kill-session -t {{.SOURCE_TUNNEL_SESSION}} 2>/dev/null || true

  logs-source:
    desc: "Attach to SOURCE tunnel (tmux)"
    cmds:
      - tmux attach -t {{.SOURCE_TUNNEL_SESSION}}


  # -------------------------
  # TARGET tunnel (DBX_TARGET_*)
  # -------------------------
  connect-target:
    desc: "Open SSM port-forward to TARGET DB (background via tmux)"
    cmds:
      - |
        set -euo pipefail
        : "${DBX_TARGET_DB_ACCESS:?DBX_TARGET_DB_ACCESS missing (ssm|direct)}"
        if [ "$DBX_TARGET_DB_ACCESS" != "ssm" ]; then
          echo "DBX_TARGET_DB_ACCESS=$DBX_TARGET_DB_ACCESS -> connect-target not needed."
          exit 0
        fi
        : "${DBX_TARGET_DB_RDS_HOST:?missing}"
        : "${DBX_TARGET_LOCAL_PORT:?missing}"
        : "${DBX_TARGET_SSM_TARGET:?missing}"

        echo "Starting TARGET SSM tunnel to $DBX_TARGET_DB_RDS_HOST:5432 on localhost:$DBX_TARGET_LOCAL_PORT"

        tmux has-session -t {{.TARGET_TUNNEL_SESSION}} 2>/dev/null && {
          echo "Target tunnel already running."
          exit 0
        } || true

        tmux new-session -d -s {{.TARGET_TUNNEL_SESSION}} \
          "aws ssm start-session \
            --region '$AWS_REGION' \
            --profile '$AWS_PROFILE' \
            --target '$DBX_TARGET_SSM_TARGET' \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters host='$DBX_TARGET_DB_RDS_HOST',portNumber='5432',localPortNumber='$DBX_TARGET_LOCAL_PORT'"

        echo "TARGET tunnel started."
    status:
      - tmux has-session -t {{.TARGET_TUNNEL_SESSION}} 2>/dev/null
    requires:
      vars:
        - AWS_PROFILE
        - AWS_REGION
        - DBX_TARGET_DB_ACCESS
        - DBX_TARGET_DB_RDS_HOST
        - DBX_TARGET_LOCAL_PORT
        - DBX_TARGET_SSM_TARGET

  disconnect-target:
    desc: "Stop TARGET SSM tunnel"
    cmds:
      - tmux kill-session -t {{.TARGET_TUNNEL_SESSION}} 2>/dev/null || true

  logs-target:
    desc: "Attach to TARGET tunnel (tmux)"
    cmds:
      - tmux attach -t {{.TARGET_TUNNEL_SESSION}}


  # -------------------------
  # BACKUP from SOURCE
  # -------------------------
  backup:
    desc: "Backup SOURCE (data-only)"
    cmds:
      - |
        set -euo pipefail
        task db:connect-source
        cleanup() { task db:disconnect-source || true; }
        trap cleanup EXIT

        echo "Running DBX backup"
        ./db/admin/dbx_backup.sh
    requires:
      vars:
        - DBX_SOURCE_DB_NAME
        - DBX_SOURCE_DB_USER
        - DBX_SOURCE_DB_PASSWORD
        - DBX_SOURCE_LOCAL_PORT


  # -------------------------
  # RESTORE to TARGET
  # -------------------------
  restore:
    desc: "Restore latest dump to TARGET"
    cmds:
      - |
        set -euo pipefail
        task db:connect-target
        cleanup() { task db:disconnect-target || true; }
        trap cleanup EXIT

        echo "Running DBX restore"
        ./db/admin/dbx_restore.sh --latest
    requires:
      vars:
        - DBX_TARGET_DB_NAME
        - DBX_TARGET_DB_USER
        - DBX_TARGET_DB_PASSWORD
        - DBX_TARGET_LOCAL_PORT

  # -------------------------
  # Ping SOURCE
  # -------------------------
  ping-source:
    desc: "Ping SOURCE DB"
    cmds:
      - |
        set -euo pipefail
        task db:connect-source
        cleanup() { task db:disconnect-source || true; }
        trap cleanup EXIT

        PGSSLMODE=require PGPASSWORD="$DBX_SOURCE_DB_PASSWORD" \
          psql \
            -h 127.0.0.1 \
            -p "$DBX_SOURCE_LOCAL_PORT" \
            -U "$DBX_SOURCE_DB_USER" \
            -d "$DBX_SOURCE_DB_NAME" \
            -c "SELECT current_database(), current_user, now();"
    requires:
      vars:
        - DBX_SOURCE_DB_NAME
        - DBX_SOURCE_DB_USER
        - DBX_SOURCE_DB_PASSWORD
        - DBX_SOURCE_LOCAL_PORT
