version: "3"

vars:
  SOURCE_TUNNEL_SESSION: db-tunnel-source

tasks:
  # -------------------------
  # SOURCE tunnel (DB_SOURCE_*)
  # -------------------------
  connect-source:
    desc: "Open SSM port-forward to SOURCE DB (background via tmux)"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        start_ssm_tunnel \
          "{{.SOURCE_TUNNEL_SESSION}}" \
          "SOURCE" \
          "${DB_SOURCE_ACCESS:?DB_SOURCE_ACCESS missing (ssm|direct)}" \
          "${DB_SOURCE_RDS_HOST:?missing}" \
          "${DB_SOURCE_LOCAL_PORT:?missing}" \
          "${DB_SOURCE_PORT:-5432}" \
          "${DB_SOURCE_SSM_TARGET:-}" \
          "${AWS_REGION:-}" \
          "${AWS_PROFILE:-}" \
          "false"
    requires:
      vars:
        - AWS_PROFILE
        - AWS_REGION
        - DB_SOURCE_ACCESS
        - DB_SOURCE_RDS_HOST
        - DB_SOURCE_LOCAL_PORT

  disconnect-source:
    desc: "Stop SOURCE SSM tunnel"
    silent: true
    cmds:
      - |
        set -euo pipefail
        . ./db/admin/task_helpers.sh
        stop_ssm_tunnel \
          "{{.SOURCE_TUNNEL_SESSION}}" \
          "SOURCE" \
          "${DB_SOURCE_ACCESS:-direct}" \
          "${DB_SOURCE_RDS_HOST:-unknown}" \
          "${DB_SOURCE_PORT:-5432}" \
          "${DB_SOURCE_LOCAL_PORT:-unknown}"

  backup:
    desc: "Backup SOURCE DB to dump file [IMPLEMENTATION TASK — prefer db:backup
      wrapper]"
    silent: true
    cmds:
      - |
        set -euo pipefail
        task backup:connect-source
        cleanup() { task backup:disconnect-source || true; }
        trap cleanup EXIT
        ./db/admin/db_backup.sh
