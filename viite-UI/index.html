<html>
  <head>
    <meta charset="utf-8">
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.0.13/css/all.css"
      integrity="sha384-DNOHZ68U8hZfKXOrtjWvjxusGo9WQnrNx2sqG0tfsghAvtVlRW3tvkXWZh58N9jp"
      crossorigin="anonymous"
    >
    <title>Viite</title>
  </head>

  <body>
    <header id="header"></header>
    <div class="app-layout">
      <div class="container">
        <div id="contentMap">
          <div id="mapdiv" class="no-copy">
            <div id="popup" class="ol-viite-roadaddress-popup">
              <div id="popup-content"></div>
            </div>
          </div>
          <button class="crosshair crosshair-center"></button>
          <div class="crosshair crosshair-top"></div>
          <div class="crosshair crosshair-bottom"></div>
          <div class="crosshair crosshair-left"></div>
          <div class="crosshair crosshair-right"></div>
        </div>
        <nav id="map-tools"></nav>
        <div id="menu-container"></div>
      </div>
      <footer id="map-plugins"></footer>
    </div>
    <script src="/node_modules/ol/dist/ol.js?v=__ol__"></script>
    <script src="/node_modules/jquery/dist/jquery.min.js?v=__jquery__"></script>
    <script src="/node_modules/moment/min/moment.min.js?v=__moment__"></script>
    <script src="/node_modules/lodash/lodash.js?v=__lodash__"></script>
    <script src="/node_modules/backbone/backbone.js?v=__backbone__"></script>
    <script type="text/javascript">
      if (window.__backboneAgent) {
        window.__backboneAgent.handleBackbone(Backbone);
      }
    </script>
    <script src="/node_modules/pikaday/pikaday.js?v=__pikaday__"></script>
    <script src="/node_modules/proj4/dist/proj4.js?v=__proj4__"></script>
    <script src="/node_modules/interactjs/dist/interact.min.js?v=__interactjs__"></script>
    <script type="module" src="src/main.js"></script>

  </body>
</html>
